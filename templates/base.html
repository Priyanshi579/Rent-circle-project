
<!DOCTYPE html>
<html>
<head>
    <title>Rent Circle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
{% with messages = get_flashed_messages() %}
  {% if messages %}
    {% for message in messages %}
      <p style="color:yellow;">{{ message }}</p>
    {% endfor %}
  {% endif %}
{% endwith %}
{% block content %}{% endblock %}
</div>
</body>
</html>
